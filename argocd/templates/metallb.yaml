apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system
  project: argocd
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: metallb
    targetRevision: 6.4.22
    helm:
      values: |
        global.security.allowInsecureImages: true
        controller:
          image:
            registry: 'bitnamilegacy/metallb-controller'
          speaker:
            image:
              registry: 'bitnamilegacy/metallb-controller'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=false
      - CreateNamespace=true

