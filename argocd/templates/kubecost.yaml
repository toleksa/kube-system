{{- if .Values.kubecost.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  annotations:
    #argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kubecost
  project: argocd
  source:
    repoURL: 'https://kubecost.github.io/kubecost/'
    chart: kubecost
    targetRevision: 3.2.0
    helm:
      values: |
        global:
          clusterId: "{{ .Values.domain}}"
        ingress:
          enabled: true
          hosts:
          - "kubecost.{{ .Values.domain}}"
        persistentVolume:
          size: 5Gi
          dbSize: 5Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=false
      - CreateNamespace=true
{{- end }}
