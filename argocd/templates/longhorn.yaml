{{- if .Values.longhorn.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    #argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: longhorn-system
    server: 'https://kubernetes.default.svc'
  project: argocd
  source:
    repoURL: 'https://charts.longhorn.io'
    targetRevision: 1.12.0
    chart: longhorn
    helm:
      values: |
        ingress:
          enabled: true
          host: "longhorn.{{ .Values.domain}}"
        persistence:
          defaultClassReplicaCount: 1
        defaultSettings:
          #instance-manager cpu request (x% * all_cpus -> x=1 and 4 cpu gives 40mi)
          guaranteedInstanceManagerCPU: 0
        preUpgradeChecker:
          jobEnabled: false
{{ if .Values.longhorn }}{{ toYaml .Values.longhorn | indent 8 }}{{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=false
{{- end }}
